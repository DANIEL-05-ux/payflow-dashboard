@if (loading) {

<div class="loading-screen">

  <div class="loader"></div>

  <h2>Loading Dashboard</h2>

  <p>
    Fetching live payment operations and analytics...
  </p>

</div>

} @else {

<div class="dashboard-wrapper">

  <div class="dashboard-header">

    <div class="header-content">

      <div class="badge">
        <i class="pi pi-bolt"></i>
        <span>Payment Operations Center</span>
      </div>

      <h1>
        Welcome back, Admin.
      </h1>

      <p>
        Monitor transactions, manage operational workflows,
        and oversee platform activity in real time.
      </p>

    </div>

    <div class="header-stats">

      <div class="mini-card">
        <span class="label">Today's Volume</span>
        <h3>$24.8K</h3>
      </div>

      <div class="mini-card">
        <span class="label">Active Users</span>
        <h3>1,284</h3>
      </div>

    </div>

  </div>

  <div class="home-container">
    <app-statistics></app-statistics>
  </div>

</div>

}
